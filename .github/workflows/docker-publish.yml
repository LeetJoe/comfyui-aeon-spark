name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - '**.py'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== Job 1：构建镜像，保存到 Cache =====
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build image (export to tar, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Cache image tar
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/image.tar
          key: docker-image-${{ github.sha }}

  # ===== Job 2：从 Cache 取回镜像并推送 =====
  push:
    runs-on: ubuntu-24.04-arm
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Restore image tar from Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/image.tar
          key: docker-image-${{ github.sha }}

      - name: Load image
        run: docker load --input ${{ runner.temp }}/image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Tag and push
        run: |
          PRIMARY_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker tag myimage:latest "$PRIMARY_TAG"
          docker push "$PRIMARY_TAG"